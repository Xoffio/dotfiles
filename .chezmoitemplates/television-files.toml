[metadata]
name = "files"
description = "A channel to select files and directories"
requirements = ["fd", "bat"]

[source]
command = [
  { name = "Default", run = "fd -t f" },
  { name = "Hidden",  run = "fd -t f -H" },
]

[preview]
command = "bat -n --color=always '{}'"
env = { BAT_THEME = "Astrodark" }

[keybindings]
shortcut = "f1"
f12 = "actions:edit"
ctrl-up = "actions:goto_parent_dir"
alt-s = "actions:croc_send"
alt-q = "actions:croc_send_qr"

[actions.edit]
description = "Opens the selected entries with the default editor (falls back to vim)"
command = "${EDITOR:-vim} {}"
shell = "{{ if eq .chezmoi.os `windows` }}powershell{{ else }}bash{{ end }}"
# use `mode = "fork"` if you want to return to tv afterwards
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv files .."
mode = "execute"

[actions.croc_send]
description = "Send selected files with croc"
{{ if eq .chezmoi.os `windows` -}}
# tv substitutes {} as a bare path on Windows; quote it ourselves.
command = "Clear-Host; croc send -- '{}' ; cmd /c pause"
shell = "powershell"
{{ else -}}
command = "croc send {}; echo; read -r -p 'Press enter to continue...'"
shell = "bash"
{{ end -}}
mode = "execute"

[actions.croc_send_qr]
description = "Send with croc + QR code"
{{ if eq .chezmoi.os `windows` -}}
command = "Clear-Host; croc send --qr -- '{}' ; cmd /c pause"
shell = "powershell"
{{ else -}}
command = "croc send --qr {}; echo; read -r -p 'Press enter to continue...'"
shell = "bash"
{{ end -}}
mode = "execute"
