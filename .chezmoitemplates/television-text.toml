[metadata]
name = "text"
description = "A channel to find and select text from files"
requirements = ["rg", "bat"]

[source]
ansi = true
output = "{strip_ansi|split:\\::..2}"
[[source.command]]
name = "Default"
run = "rg . --no-heading --line-number --colors 'match:fg:white' --colors 'path:fg:blue' --color=always"

[[source.command]]
name = "Hidden"
run = "rg . --no-heading --line-number --hidden --colors 'match:fg:white' --colors 'path:fg:blue' --color=always"

[preview]
command = "bat -n --color=always '{strip_ansi|split:\\::0}'"
offset = "{strip_ansi|split:\\::1}"

[keybindings]
enter = "actions:edit"
alt-s = "actions:croc_send"
alt-q = "actions:croc_send_qr"

[preview.env]
BAT_THEME = "Astrodark"

[ui.preview_panel]
header = "{strip_ansi|split:\\::..2}"
border_type = "rounded"

[actions.edit]
description = "Open file in neovim at line"
command = "nvim '+{strip_ansi|split:\\::1}' '{strip_ansi|split:\\::0}'"
shell = "{{ if eq .chezmoi.os `windows` }}powershell{{ else }}bash{{ end }}"
mode = "execute"

[actions.croc_send]
description = "Send selected files with croc"
{{ if eq .chezmoi.os `windows` -}}
# Quote the extracted path; cmd pause works in non-interactive PowerShell
command = "Clear-Host; croc send -- '{strip_ansi|split:\\::0}' ; cmd /c pause"
shell = "powershell"
{{ else -}}
command = "croc send {strip_ansi|split:\\::0}; echo; read -r -p 'Press enter to continue...'"
shell = "bash"
{{ end -}}
mode = "execute"

[actions.croc_send_qr]
description = "Send with croc + QR code"
{{ if eq .chezmoi.os `windows` -}}
command = "Clear-Host; croc send --qr -- '{strip_ansi|split:\\::0}' ; cmd /c pause"
shell = "powershell"
{{ else -}}
command = "croc send --qr {strip_ansi|split:\\::0}; echo; read -r -p 'Press enter to continue...'"
shell = "bash"
{{ end -}}
mode = "execute"
