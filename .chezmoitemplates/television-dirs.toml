[metadata]
name = "dirs"
description = "A channel to select from directories"
requirements = ["fd"]

[source]
command = [
  { name = "Default", run = "fd -t d" },
  { name = "Hidden",  run = "fd -t d --hidden" },
]

[preview]
{{ if eq .chezmoi.os `windows` -}}
command = "cmd /c dir '{}'"
{{ else if eq .chezmoi.os `darwin` -}}
command = "ls -laG '{}'"
{{ else -}}
command = "ls -la --color=always '{}'"
{{ end -}}

[keybindings]
shortcut = "f2"
alt-s = "actions:croc_send"
alt-q = "actions:croc_send_qr"
alt-z = "actions:croc_send_zip"

[actions.cd]
description = "Open a shell in the selected directory"
{{ if eq .chezmoi.os `windows` -}}
command = "cd {}; powershell"
shell = "powershell"
{{ else -}}
command = "cd {} && $SHELL"
shell = "bash"
{{ end -}}
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv dirs .."
mode = "execute"

[actions.croc_send]
description = "Send selected directories with croc"
{{ if eq .chezmoi.os `windows` -}}
# tv passes paths single-quoted; strip the quotes for native exe args.
# Read-Host fails in tv's non-interactive PowerShell, so use cmd's pause.
command = "$dirs = {} -replace \"'\", ''; croc send $dirs; cmd /c pause"
shell = "powershell"
{{ else -}}
command = "croc send {}; echo; read -r -p 'Press enter to continue...'"
shell = "bash"
{{ end -}}
mode = "execute"

[actions.croc_send_qr]
description = "Archive selection into one tar.gz, then send with croc + QR code"
{{ if eq .chezmoi.os `windows` -}}
# tv passes paths single-quoted; strip quotes, name archive after first folder.
command = "$dirs = {} -replace \"'\", ''; $first = ($dirs -split ' ')[0]; $name = Split-Path $first -Leaf; $archive = Join-Path $env:TEMP \"$name.tar.gz\"; tar -czf $archive $dirs; if ($?) { croc send --qr $archive }; Remove-Item $archive -ErrorAction SilentlyContinue; cmd /c pause"
shell = "powershell"
{{ else -}}
# Name the archive after the first selected folder: set -- parses the quoted
# list, basename of $1 gives the folder name
command = "set -- {}; name=$(basename -- \"$1\"); archive=\"/tmp/$name.tar.gz\"; tar -czf \"$archive\" {} && croc send --qr \"$archive\"; rm -f \"$archive\"; echo; read -r -p 'Press enter to continue...' || true"
shell = "bash"
{{ end -}}
mode = "execute"

[actions.croc_send_zip]
description = "Archive selection into one tar.gz, then send with croc"
{{ if eq .chezmoi.os `windows` -}}
# tv passes paths single-quoted; strip quotes, name archive after first folder.
command = "$dirs = {} -replace \"'\", ''; $first = ($dirs -split ' ')[0]; $name = Split-Path $first -Leaf; $archive = Join-Path $env:TEMP \"$name.tar.gz\"; tar -czf $archive $dirs; if ($?) { croc send $archive }; Remove-Item $archive -ErrorAction SilentlyContinue; cmd /c pause"
shell = "powershell"
{{ else -}}
# Name the archive after the first selected folder: set -- parses the quoted
# list, basename of $1 gives the folder name
command = "set -- {}; name=$(basename -- \"$1\"); archive=\"/tmp/$name.tar.gz\"; tar -czf \"$archive\" {} && croc send \"$archive\"; rm -f \"$archive\"; echo; read -r -p 'Press enter to continue...' || true"
shell = "bash"
{{ end -}}
mode = "execute"
