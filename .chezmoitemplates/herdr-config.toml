onboarding = false

[terminal]
{{- if eq .chezmoi.os "windows" }}
default_shell = "powershell"
{{- else }}
default_shell = "fish"
{{- end }}

[keys]
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'
rename_tab = "prefix+comma"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
# tmux-style pane resizing: prefix+Ctrl+Arrow (one step per prefix press)
# For continuous resizing use resize mode (prefix+r), hold arrows, Esc/Enter to exit
resize_pane_left = "prefix+ctrl+left"
resize_pane_down = "prefix+ctrl+down"
resize_pane_up = "prefix+ctrl+up"
resize_pane_right = "prefix+ctrl+right"
remove_worktree = "prefix+d"

{{- if ne .chezmoi.os "windows" }}
# Seamless nvim <-> herdr pane navigation via smart-splits.nvim's herdr plugin
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"
{{- end }}

# Fuzzy content search with television (ripgrep channel)
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "tv text"
width = "80%"
height = "80%"
description = "find in files (tv + ripgrep)"

# Television channel picker
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "tv --show-remote"
width = "80%"
height = "80%"
description = "tv channel list"

# Lazygit — review changes, merge, etc.
[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
description = "lazygit"

[ui]
status_indicators = "symbols"
# Use the native cursor instead of the block cursor for the host terminal.
host_cursor = "native"

[ui.sound]
enabled = true
{{- if eq .chezmoi.os "windows" }}
{{- $sounds := joinPath .chezmoi.homeDir ".config" "herdr" "sounds" }}
path = {{ joinPath $sounds "woo_vu_luvub_dub_dub.mp3" | quote }}
done_path = {{ joinPath $sounds "oh_yeah.mp3" | quote }}
request_path = {{ joinPath $sounds "i_want_you.mp3" | quote }}
{{- else }}
path = "sounds/woo_vu_luvub_dub_dub.mp3"
done_path = "sounds/oh_yeah.mp3"
request_path = "sounds/i_want_you.mp3"
{{- end }}

[ui.toast]
delivery = "herdr"
