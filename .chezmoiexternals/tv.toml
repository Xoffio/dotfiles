{{ $tvVersion := .tools.tv.version -}}
{{- $tvTriple := "" -}}
{{- if and (eq .chezmoi.os `linux`) (eq .chezmoi.arch `amd64`) -}}
  {{- $tvTriple = "x86_64-unknown-linux-musl" -}}
{{- else if and (eq .chezmoi.os `linux`) (eq .chezmoi.arch `arm64`) -}}
  {{- $tvTriple = "aarch64-unknown-linux-gnu" -}}
{{- else if and (eq .chezmoi.os `darwin`) (eq .chezmoi.arch `amd64`) -}}
  {{- $tvTriple = "x86_64-apple-darwin" -}}
{{- else if and (eq .chezmoi.os `darwin`) (eq .chezmoi.arch `arm64`) -}}
  {{- $tvTriple = "aarch64-apple-darwin" -}}
{{- else if eq .chezmoi.os `windows` -}}
  {{- $tvTriple = "x86_64-pc-windows-msvc" -}}
{{- end }}
{{- $tvChecksum := index .hashes.tv (printf "%s_%s" .chezmoi.os .chezmoi.arch) | default "" -}}

[".local/bin/tv{{ if eq .chezmoi.os `windows` }}.exe{{ end }}"]
    type = "archive-file"
    url = "https://github.com/alexpasmantier/television/releases/download/{{ $tvVersion }}/tv-{{ $tvVersion }}-{{ $tvTriple }}.{{ if eq .chezmoi.os `windows` }}zip{{ else }}tar.gz{{ end }}"
    path = "{{ if eq .chezmoi.os `windows` }}tv.exe{{ else }}tv-{{ $tvVersion }}-{{ $tvTriple }}/tv{{ end }}"
    executable = true
    checksum.sha256 = "{{ $tvChecksum }}"
