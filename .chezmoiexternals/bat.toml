{{ $batVersion := .tools.bat.version -}}
{{- $batTriple := "" -}}
{{- if and (eq .chezmoi.os `linux`) (eq .chezmoi.arch `amd64`) -}}
  {{- $batTriple = "x86_64-unknown-linux-musl" -}}
{{- else if and (eq .chezmoi.os `linux`) (eq .chezmoi.arch `arm64`) -}}
  {{- $batTriple = "aarch64-unknown-linux-gnu" -}}
{{- else if and (eq .chezmoi.os `darwin`) (eq .chezmoi.arch `amd64`) -}}
  {{- $batTriple = "x86_64-apple-darwin" -}}
{{- else if and (eq .chezmoi.os `darwin`) (eq .chezmoi.arch `arm64`) -}}
  {{- $batTriple = "aarch64-apple-darwin" -}}
{{- else if eq .chezmoi.os `windows` -}}
  {{- $batTriple = "x86_64-pc-windows-msvc" -}}
{{- end }}
{{- $batChecksum := index .hashes.bat (printf "%s_%s" .chezmoi.os .chezmoi.arch) | default "" -}}

[".local/bin/bat{{ if eq .chezmoi.os `windows` }}.exe{{ end }}"]
    type = "archive-file"
    url = "https://github.com/sharkdp/bat/releases/download/v{{ $batVersion }}/bat-v{{ $batVersion }}-{{ $batTriple }}.{{ if eq .chezmoi.os `windows` }}zip{{ else }}tar.gz{{ end }}"
    path = "bat-v{{ $batVersion }}-{{ $batTriple }}/bat{{ if eq .chezmoi.os `windows` }}.exe{{ end }}"
    executable = true
    checksum.sha256 = "{{ $batChecksum }}"
