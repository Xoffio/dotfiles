{{ $fdVersion := .versions.fd -}}
{{- $fdTriple := "" -}}
{{- if and (eq .chezmoi.os `linux`) (eq .chezmoi.arch `amd64`) -}}
  {{- $fdTriple = "x86_64-unknown-linux-musl" -}}
{{- else if and (eq .chezmoi.os `linux`) (eq .chezmoi.arch `arm64`) -}}
  {{- $fdTriple = "aarch64-unknown-linux-gnu" -}}
{{- else if and (eq .chezmoi.os `darwin`) (eq .chezmoi.arch `amd64`) -}}
  {{- $fdTriple = "x86_64-apple-darwin" -}}
{{- else if and (eq .chezmoi.os `darwin`) (eq .chezmoi.arch `arm64`) -}}
  {{- $fdTriple = "aarch64-apple-darwin" -}}
{{- else if eq .chezmoi.os `windows` -}}
  {{- $fdTriple = "x86_64-pc-windows-msvc" -}}
{{- end }}
{{- $fdChecksum := index .hashes.fd (printf "%s_%s" .chezmoi.os .chezmoi.arch) | default "" -}}

[".local/bin/fd{{ if eq .chezmoi.os `windows` }}.exe{{ end }}"]
    type = "archive-file"
    url = "https://github.com/sharkdp/fd/releases/download/v{{ $fdVersion }}/fd-v{{ $fdVersion }}-{{ $fdTriple }}.{{ if eq .chezmoi.os `windows` }}zip{{ else }}tar.gz{{ end }}"
    path = "fd-v{{ $fdVersion }}-{{ $fdTriple }}/fd{{ if eq .chezmoi.os `windows` }}.exe{{ end }}"
    executable = true
    checksum.sha256 = "{{ $fdChecksum }}"
