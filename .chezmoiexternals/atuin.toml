# Atuin
{{ $atVersion := .versions.atuin -}}
{{- $atTriple := "" -}}
{{- $atChecksum := "" -}}
{{- if and (eq .chezmoi.os `linux`) (eq .chezmoi.arch `amd64`) -}}
  {{- $atTriple = "x86_64-unknown-linux-musl" -}}
  {{- $atChecksum = "d1b40dd6e7cd3d823867ffe22b39a025bc420f7875926ae9ca974155378da14d" -}}
{{- else if and (eq .chezmoi.os `linux`) (eq .chezmoi.arch `arm64`) -}}
  {{- $atTriple = "aarch64-unknown-linux-musl" -}}
  {{- $atChecksum = "faf91adc71e6b661b21ed4f486babbd7af9d17363d4276da4a0251f83c72498d" -}}
{{- else if and (eq .chezmoi.os `darwin`) (eq .chezmoi.arch `arm64`) -}}
  {{- $atTriple = "aarch64-apple-darwin" -}}
  {{- $atChecksum = "c988be1cde19cd7295ce64bc8b955d42fb1855e5227cb640c87fc09c8408c3fc" -}}
{{- else if and (eq .chezmoi.os `darwin`) (eq .chezmoi.arch `amd64`) -}}
  {{- $atTriple = "x86_64-apple-darwin" -}}
  {{- $atChecksum = "f87ff4bef3f818f81474713dfc964008793a77ade12f8076f9a82237695a587a" -}}
{{- else if eq .chezmoi.os `windows` -}}
  {{- $atTriple = "x86_64-pc-windows-msvc" -}}
  {{- $atChecksum = "3e1c1282da39039a7ceb8e53c6b624dfb86200823559bbe80c0ace3d0baf09ae" -}}
{{- end }}

[".local/bin/atuin{{ if eq .chezmoi.os `windows` }}.exe{{ end }}"]
    type = "archive-file"
    url = "https://github.com/atuinsh/atuin/releases/download/v{{ $atVersion }}/atuin-{{ $atTriple }}.{{ if eq .chezmoi.os `windows` }}zip{{ else }}tar.gz{{ end }}"
    path = "{{ if eq .chezmoi.os `windows` }}atuin.exe{{ else }}atuin-{{ $atTriple }}/atuin{{ end }}"
    executable = true
    {{ if $atChecksum -}}
    checksum.sha256 = "{{ $atChecksum }}"
    {{ end -}}
